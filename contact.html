<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontak - RetroGims</title>
</head>
<body style="background:#111;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:2rem">
  <h1>Hubungi Kami</h1>
  <form action="https://formspree.io/f/example" method="POST" style="display:inline-block;text-align:left;max-width:400px;width:100%">
    <label>Email Anda:</label><br>
    <input type="email" name="email" required style="width:100%;padding:0.5rem;margin:0.5rem 0;"><br>
    <label>Pesan:</label><br>
    <textarea name="message" rows="5" style="width:100%;padding:0.5rem;margin:0.5rem 0;"></textarea><br>
    <button type="submit" style="background:#b00000;color:#fff;padding:0.5rem 1rem;border:none;border-radius:4px;">Kirim</button>
  </form>
</body>
</html>
